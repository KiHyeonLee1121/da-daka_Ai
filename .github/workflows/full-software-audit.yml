name: Full software audit

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install CPU test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e ./laptop_ai --no-deps
      - name: Compile Python sources
        run: |
          python -m compileall -q \
            actuator control sensors utils vision tests tools \
            laptop_ai/laptop_ai laptop_ai/tests \
            ros2_ws/src/da_daka_control/da_daka_control \
            ros2_ws/src/da_daka_control/launch \
            ros2_ws/src/da_daka_control/test
      - name: Parse YAML and XML
        run: |
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import yaml

          for path in Path('.').rglob('*.yaml'):
              with path.open('r', encoding='utf-8') as stream:
                  yaml.safe_load(stream)
          for path in Path('.').rglob('package.xml'):
              ET.parse(path)
          PY
      - name: Root tests
        run: python -m pytest -q tests
      - name: Laptop protocol, selection and optimizer tests
        run: python -m pytest -q laptop_ai/tests
      - name: Pure ROS control tests
        env:
          PYTHONPATH: ros2_ws/src/da_daka_control
        run: |
          python -m pytest -q \
            ros2_ws/src/da_daka_control/test/test_autonomous_cleaning_fsm.py \
            ros2_ws/src/da_daka_control/test/test_autonomous_cleaning_integration.py \
            ros2_ws/src/da_daka_control/test/test_nozzle_alignment.py \
            ros2_ws/src/da_daka_control/test/test_panel_mapping.py \
            ros2_ws/src/da_daka_control/test/test_perception_protocol.py \
            ros2_ws/src/da_daka_control/test/test_route_planner.py \
            ros2_ws/src/da_daka_control/test/test_spray_actuator.py \
            ros2_ws/src/da_daka_control/test/test_spray_reaction.py \
            ros2_ws/src/da_daka_control/test/test_spray_sequence.py \
            ros2_ws/src/da_daka_control/test/test_video_streamer.py

  ros2-jazzy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ros:jazzy-ros-base
    steps:
      - uses: actions/checkout@v7
      - name: Install ROS build and test dependencies
        shell: bash
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pytest \
            python3-flake8 \
            python3-pydocstyle \
            python3-serial \
            python3-rosdep \
            ros-jazzy-mavros-msgs
          rm -rf /var/lib/apt/lists/*
      - name: Resolve ROS dependencies
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          rosdep update
          rosdep install --from-paths ros2_ws/src --ignore-src -r -y
      - name: Build ROS workspace
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          colcon build --symlink-install --event-handlers console_direct+
      - name: Run ROS package tests
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          cd ros2_ws
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose
