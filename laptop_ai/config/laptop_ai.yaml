video:
  source: "http://192.168.0.20:8080/video"
  backend: "opencv"
  reconnect_interval_s: 2.0
  max_consecutive_failures: 30
  frame_width: 640
  frame_height: 480
  process_every_n_frames: 1
  max_frame_age_s: 0.5
  # Keep the capture queue at one frame to minimize camera-to-inference age.
  capture_buffer_size: 1

detector:
  backend: "opencv"
  confidence_threshold: 0.5
  model_path: null
  # auto prefers TensorRT, CUDA, DirectML, then safely falls back to CPU.
  execution_provider: "auto"
  input_width: 640
  input_height: 640
  class_id: 0
  output_format: "xyxy_score_class"
  coordinates_normalized: false
  min_area: 80
  max_area: 50000
  threshold_mode: "adaptive"
  reject_specular_highlights: true
  specular_v_threshold: 245
  specular_saturation_max: 45
  ignore_border_px: 4
  priority_w_area: 0.45
  priority_w_dist: 0.25
  priority_w_conf: 0.30

network:
  destination_host: "192.168.0.20"
  destination_port: 5005
  source_id: "laptop-ai-01"
  send_no_detection: true
  heartbeat_interval_s: 0.2
  max_packet_bytes: 4096

debug:
  # Keep headless by default for the primary low-latency path.
  show_window: false
  save_video: false
  log_level: "INFO"
  summary_interval_s: 5.0

# Tuned for this Ryzen 5 7500F (12 logical CPUs) and RX 7600 laptop-AI host.
performance:
  opencv_num_threads: 12
  opencv_use_opencl: false
  opencv_use_optimized: true
  onnx_intra_op_threads: 12
  onnx_inter_op_threads: 0
  onnx_execution_mode: "sequential"
  onnx_graph_optimization: "all"
  onnx_enable_cpu_mem_arena: true
  onnx_device_id: 0
  # Compile/allocate before the first live frame and reuse GPU output memory.
  onnx_warmup_runs: 3
  onnx_use_io_binding: true
  # NVIDIA CUDA/TensorRT settings are ignored by DirectML and CPU.
  onnx_cuda_conv_use_max_workspace: true
  onnx_cuda_prefer_nhwc: false
  onnx_tensorrt_fp16: true
  onnx_tensorrt_engine_cache: true
  onnx_tensorrt_timing_cache: true
  onnx_tensorrt_cache_path: ".runtime/onnx-tensorrt"
