spray_controller:
  ros__parameters:
    # Keep both gates closed until GPIO mapping and the driver circuit have
    # passed a propellers-off bench test on the real Raspberry Pi 5.
    backend: "mock"
    output_enabled: false
    gpio_chip: ""
    gpio_line_offset: -1
    active_high: true
    pulse_duration_s: 0.30
    minimum_pulse_s: 0.05
    maximum_pulse_s: 1.00
    cooldown_s: 2.0
    maximum_pulses_per_session: 3
    status_rate_hz: 10.0
