panel_survey:
  ros__parameters:
    perception_topic: "/ai/perception"
    pose_topic: "/mavros/local_position/pose"
    range_topic: "/distance/filtered"
    active_topic: "/panel_survey/active"
    map_topic: "/panel_survey/map"
    state_topic: "/panel_survey/state"
    reset_service: "/panel_survey/reset"
    finalize_service: "/panel_survey/finalize"

    # Replace with a measured ground footprint from the mounted camera.
    footprint_width_at_1m_m: 1.30
    footprint_height_at_1m_m: 0.73
    image_x_positive_is_left: false
    image_y_positive_is_forward: false
    # Residual camera-to-body mounting calibration. Vehicle roll/pitch/yaw is
    # read live from MAVROS and applied on top of these fixed offsets.
    camera_mount_roll_deg: 0.0
    camera_mount_pitch_deg: 0.0
    camera_mount_yaw_deg: 0.0
    # 2026-08-17 measurement in body FLU, using the nozzle/range assembly as
    # the vehicle reference: camera is forward 0.07 m, left 0.05 m and down
    # 0.16 m. The range correction keeps image footprint scale consistent.
    camera_offset_forward_m: 0.07
    camera_offset_left_m: 0.05
    camera_offset_up_m: -0.16
    camera_height_above_range_sensor_m: -0.16

    merge_radius_m: 0.45
    minimum_observations: 3
    minimum_panel_confidence: 0.55
    # Reject mapping frames outside the stable-hover envelope.
    maximum_survey_tilt_deg: 7.0
    input_timeout_s: 0.5
    publish_rate_hz: 5.0
